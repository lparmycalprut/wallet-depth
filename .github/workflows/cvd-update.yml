name: CVD update (hourly · GMGN)

on:
  schedule:
    - cron: "30 * * * *"   # every hour at :30
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  cvd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install requests pandas curl_cffi

      - name: Update CVD buckets (GMGN Trades API)
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          HELIUS_API_KEYS: ${{ secrets.HELIUS_API_KEYS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/update_cvd.py 80

      - name: Commit cvd.json
        run: |
          git config user.name "cvd-bot"
          git config user.email "actions@github.com"
          git stash -u || true
          git pull --rebase || true
          git stash pop || true
          # never commit conflict markers into JSON data files
          for f in cvd.json signals.json conviction.json levels.json breakouts.json; do
            if grep -q "<<<<<<<" "$f" 2>/dev/null; then
              git checkout --theirs "$f" 2>/dev/null || git checkout HEAD -- "$f" || true
            fi
          done
          # holder_snapshots.json may not exist yet (first run) — tolerate
          git add cvd.json signals.json conviction.json levels.json breakouts.json
          git add holder_snapshots.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: cvd update $(date -u +%FT%H:%M) · GMGN"
          git push || (git pull --rebase && git push) || true

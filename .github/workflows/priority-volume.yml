name: Priority Volume Spike (15-Minute)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests pandas curl_cffi base58

      - name: Scan priority tokens
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/priority_scan.py

      - name: Commit priority signal log
        run: |
          git config user.name "prepump-bot"
          git config user.email "actions@github.com"

          git add signals.json

          git diff --cached --quiet || git commit -m "chore: priority volume scan $(date -u +%FT%H:%M) UTC"

          git push || true

name: Pre-Pump & Wyckoff 15M Cron Detector

on:
  schedule:
    - cron: "14,29,44,59 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-detector:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests pandas curl_cffi base58

      - name: Run Detector
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/prepump_wyckoff_cron.py

      - name: Commit signals.json
        run: |
          git config user.name "prepump-bot"
          git config user.email "actions@github.com"

          git stash -u || true
          git pull --rebase || true
          git stash pop || true

          git add signals.json watchlist.json 2>&1 || true
          git diff --cached --quiet || git commit -m "chore: update signals and watchlist $(date -u +%FT%H:%M) UTC"
          git push || (git pull --rebase && git push) || true

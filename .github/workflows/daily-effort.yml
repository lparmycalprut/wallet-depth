name: Holder Dust Scanner

on:
  schedule:
    # Target 1× per jam (sejak 2026-09-04). GitHub Actions men-throttle
    # schedule (kadens nyata bisa jadi ±2 jam dan bisa telat/dilewati —
    # lihat DEPLOY.md), jadi ini target, bukan janji. Alert/dedup memakai
    # bucket 4 jam dan titik mentah per jam, sehingga run yang telat tetap
    # aman; yang penting tidak lebih sering dari ~1 jam.
    - cron: "0 * * * *"

  workflow_dispatch:
    inputs:
      telegram_test:
        description: "Kirim test alert Telegram sebelum scan"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: holder-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    # Run hourly yang lambat tidak boleh menumpuk antre di concurrency
    # group: tanpa batas ini sebuah run > 1 jam bisa membuat beberapa run
    # tertunda sekaligus (45 menit jauh di atas durasi scan normal).
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests curl_cffi

      - name: Scan holder dust watchlist
        env:
          # Token untuk publish holder_status.json ke branch holder-live.
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

          # Holder source Helius.
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          HELIUS_API_KEYS: ${{ secrets.HELIUS_API_KEYS }}

          # Telegram holder-dust alerts.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          # Bernilai true ketika workflow_dispatch meminta test alert.
          TELEGRAM_TEST: ${{ inputs.telegram_test || 'false' }}

        run: |
          EXTRA_ARGS=""
          if [ "$TELEGRAM_TEST" = "true" ]; then
            EXTRA_ARGS="--telegram-test"
          fi

          python scripts/scan_holders.py --max-wallets 3000 $EXTRA_ARGS

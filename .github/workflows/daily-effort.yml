name: Realtime Bidirectional Reversal

on:
  schedule:
    # GitHub Actions dapat terlambat beberapa menit.
    # Engine tetap memakai rolling window sehingga tidak bergantung
    # pada waktu mulai yang persis.
    - cron: "*/10 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: realtime-reversal
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests curl_cffi

      - name: Restore scanner state and rolling trade cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/reversal_trades.json.gz
            last_scan_result.json
          key: reversal-state-${{ github.run_id }}
          restore-keys: |
            reversal-state-

      - name: Scan rolling reversal windows
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_LIQUIDITY_USD: "5000"
        run: |
          python scripts/realtime_reversal.py

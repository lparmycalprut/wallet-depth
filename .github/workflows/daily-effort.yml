name: Silent Accumulation 12H Scanner

on:
  schedule:
    # GitHub Actions dapat terlambat beberapa menit; engine memakai window
    # rolling 12 jam sehingga tidak bergantung pada waktu mulai yang persis.
    - cron: "*/15 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: silent-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests curl_cffi

      - name: Scan silent accumulation (12h) + holder dust
        env:
          # Sumber data utama = Helius (holder + flow). Isi secret repo
          # HELIUS_API_KEY / HELIUS_API_KEYS; tanpa secret, pipeline jatuh
          # otomatis ke GMGN.
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          HELIUS_API_KEYS: ${{ secrets.HELIUS_API_KEYS }}
        run: |
          python scripts/scan_silent.py --max-wallets 3000 --max-trade-pages 8

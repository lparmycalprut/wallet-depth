name: Holder Dust Scanner

on:
  schedule:
    # Kadens target **±15 menit** sejak 2026-09-05 (watchlist LP: Chart LP
    # Meteora + Robinhood LP; watchlist biasa tetap di-scan penuh tiap slot
    # 4 jam oleh scripts/scan_holders.py). Schedule GitHub bersifat
    # best-effort dan bisa terthrottle sampai ±2 jam (lihat DEPLOY.md), jadi
    # kadens 15 menit yang sesungguhnya dijaga langkah "chain" di bawah:
    # tiap run men-dispatch run berikutnya setelah tidur sampai batas 15
    # menit berikutnya. Run ganda (chain + schedule) dicek gate
    # MIN_RUN_GAP_SEC di scanner dan keluar tanpa kerja.
    - cron: "*/15 * * * *"

  workflow_dispatch:
    inputs:
      telegram_test:
        description: "Kirim test alert Telegram sebelum scan"
        required: false
        default: false
        type: boolean
      scan_all:
        description: "Scan SEMUA token sekarang (scope=all + abaikan gate run ganda) — dipakai saat token baru ditambahkan"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  # Chain dispatch: langkah terakhir POST /actions/workflows/.../dispatches.
  actions: write

concurrency:
  group: holder-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install requests curl_cffi

      - name: Holder scan (LP ±15 menit · biasa slot 4 jam)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        # --max-wallets 3000: jaga durasi run (slot 4 jam memindai token
        # biasa sekaligus). Hapus flag ini bila mau FULL 100.000 wallet.
        run: |
          ARGS=""
          if [ "${{ inputs.telegram_test }}" = "true" ]; then
            ARGS="$ARGS --telegram-test"
          fi
          if [ "${{ inputs.scan_all }}" = "true" ]; then
            ARGS="$ARGS --scope all --ignore-gap"
          fi
          python scripts/scan_holders.py --max-wallets 3000 $ARGS

      - name: Chain run berikutnya
        if: success() || failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOW=$(date +%s)
          WAIT=$((900 - NOW % 900 + 20))
          echo "Tidur ${WAIT}s lalu dispatch run berikutnya."
          sleep $WAIT
          curl -sSf -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/daily-effort.yml/dispatches \
            -d '{"ref":"main"}'

# Holder Dust Scanner — cron HANYA ±5 menit, lane LP saja.
# Watchlist biasa (slot 4 jam) DIMATIKAN di scanner (REGULAR_SCAN_ENABLED=0).
# Pengingat ⚡ Telegram = tiap scan 5 menit selama dust > 0,1% MC.
name: Holder Dust Scanner

on:
  schedule:
    # Target ±5 menit. GitHub schedule best-effort (bisa telat sampai jam),
    # jadi ritme dijaga langkah "Chain run berikutnya" di bawah.
    - cron: "*/5 * * * *"

  workflow_dispatch:
    inputs:
      telegram_test:
        description: "Kirim test alert Telegram sebelum scan"
        required: false
        default: false
        type: boolean
      scan_all:
        description: "Scan SEMUA token sekarang (scope=all + abaikan gate run ganda) — watchlist biasa + LP, termasuk slot 4 jam"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: holder-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install requests curl_cffi

      - name: Holder scan (LP ±5 menit · 4 jam off)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          # 4 jam watchlist biasa: default OFF di kode. Nyalakan lagi:
          # REGULAR_SCAN_ENABLED: "1"
          # Hemat Helius (Meteora tiap 3 run = ±15 menit, Robinhood tetap 5 menit):
          # LP_SCAN_RUN_MULTIPLIER: "3"
        run: |
          ARGS=""
          if [ "${{ inputs.telegram_test }}" = "true" ]; then
            ARGS="$ARGS --telegram-test"
          fi
          if [ "${{ inputs.scan_all }}" = "true" ]; then
            ARGS="$ARGS --scope all --ignore-gap"
          fi
          python scripts/scan_holders.py --max-wallets 3000 $ARGS

      - name: Chain run berikutnya
        if: success() || failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOW=$(date +%s)
          WAIT=$((300 - NOW % 300 + 20))
          echo "Tidur ${WAIT}s lalu dispatch run berikutnya."
          sleep $WAIT
          curl -sSf -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/daily-effort.yml/dispatches \
            -d '{"ref":"main"}'

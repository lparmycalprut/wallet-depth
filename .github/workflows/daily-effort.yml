name: Holder Dust Scanner

on:
  schedule:
    # GitHub Actions dapat terlambat beberapa menit; history di-resample
    # per 4 jam sehingga tidak bergantung pada waktu mulai yang persis.
    - cron: "*/15 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: holder-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests curl_cffi

      - name: Scan holder dust watchlist
        env:
          # Wajib: tanpa token, publish holder_status.json ke branch
          # `holder-live` gagal diam-diam dan watchlist di dashboard kosong.
          # Pakai PAT (secrets.GH_TOKEN) bila ada, fallback token bawaan.
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          # Wajib: holder diambil via Helius DAS. GMGN diblokir dari runner
          # Actions sehingga tanpa key hasilnya 0 holder / dust "—".
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          HELIUS_API_KEYS: ${{ secrets.HELIUS_API_KEYS }}
        run: |
          python scripts/scan_holders.py --max-wallets 3000

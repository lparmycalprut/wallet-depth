# Holder Dust Scanner — kadens run ±5 menit (KEDUA lane LP tiap run).
name: Holder Dust Scanner

on:
  schedule:
    # Kadens target ±5 menit sejak 2026-09-06. Yang berubah hanya kadens RUN;
    # scanner (scripts/scan_holders.py) yang membagi lane-nya: KEDUA watchlist
    # LP (Chart LP Meteora + Robinhood LP) tiap run, watchlist biasa slot 4 jam,
    # pengingat ⚡ Telegram tetap maks 1x/15 menit per token. Schedule GitHub
    # bersifat best-effort (bisa terthrottle sampai ±2 jam), jadi ritme 5 menit
    # dipegang langkah "Chain run berikutnya" di bawah.
    - cron: "*/5 * * * *"

  workflow_dispatch:
    inputs:
      telegram_test:
        description: "Kirim test alert Telegram sebelum scan"
        required: false
        default: false
        type: boolean
      scan_all:
        description: "Scan SEMUA token sekarang (scope=all + abaikan gate run ganda) — dipakai saat token baru ditambahkan"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  # Chain dispatch: langkah terakhir POST /actions/workflows/.../dispatches.
  actions: write

concurrency:
  group: holder-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install requests curl_cffi

      - name: Holder scan (LP ±5 menit · biasa slot 4 jam)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          # Katup hemat kuota Helius (opsional). 3 = scan Solana kembali
          # ±15 menit, Robinhood LP tetap tiap run. Default 1 = tiap run.
          # LP_SCAN_RUN_MULTIPLIER: "3"
        # --max-wallets 3000 menjaga durasi run. Hapus flag ini bila mau FULL
        # 100.000 wallet. Kalau mulai kena 429: turunkan angkanya atau
        # uncomment LP_SCAN_RUN_MULTIPLIER di atas.
        run: |
          ARGS=""
          if [ "${{ inputs.telegram_test }}" = "true" ]; then
            ARGS="$ARGS --telegram-test"
          fi
          if [ "${{ inputs.scan_all }}" = "true" ]; then
            ARGS="$ARGS --scope all --ignore-gap"
          fi
          python scripts/scan_holders.py --max-wallets 3000 $ARGS

      - name: Chain run berikutnya
        if: success() || failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOW=$(date +%s)
          # Bangun tepat setelah batas 5 menit berikutnya (+20 s supaya tidak
          # menabrak run schedule pada batas yang sama). Sebelum 2026-09-06
          # angkanya 900 (kadens 15 menit).
          WAIT=$((300 - NOW % 300 + 20))
          echo "Tidur ${WAIT}s lalu dispatch run berikutnya."
          sleep $WAIT
          curl -sSf -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/daily-effort.yml/dispatches \
            -d '{"ref":"main"}'

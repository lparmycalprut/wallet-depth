name: CTO Incubation Radar (hourly)

on:
  schedule:
    - cron: "15 * * * *"   # every hour at :15, offset from CVD at :30
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  cto-radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install requests pandas curl_cffi base58 plotly
      - name: Run CTO Radar - incubation scan + deep scan + auto watchlist + telegram
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          HELIUS_API_KEYS: ${{ secrets.HELIUS_API_KEYS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Step 1: Incubation scan (2d-60d death valley) ==="
          python incubation_radar.py --limit 30 || true
          echo ""
          echo "=== Step 2: Deep scan + auto-watchlist + telegram ==="
          python cto_deep_scan.py --from-radar --limit 30 --auto-watchlist --telegram || true
      - name: Commit watchlist + signals
        run: |
          git config user.name "cto-radar-bot"
          git config user.email "actions@github.com"
          git stash -u || true
          git pull --rebase || true
          git stash pop || true
          for f in watchlist.json signals.json conviction.json; do
            if grep -q "<<<<<<<" "$f" 2>/dev/null; then
              git checkout --theirs "$f" 2>/dev/null || git checkout HEAD -- "$f" || true
            fi
          done
          git add watchlist.json signals.json 2>/dev/null || true
          git add watchlist_pending.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: cto radar $(date -u +%FT%H:%M) - auto watchlist death valley 2d-60d"
          git push || (git pull --rebase && git push) || true

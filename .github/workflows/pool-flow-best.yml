name: Pool Flow — Ringkasan alert

# Alert RINGKASAN Scan ALL (pool FEE PRINTER) tiap 15 menit (permintaan user, 2026-11-24).
# Menit 7, 22, 37, 52 (bukan :00) supaya tidak berebut dengan beban jadwal tiap jam GitHub.
# Cron GitHub bisa terlambat atau dilewati (dokumentasi GitHub: event schedule bisa tertunda
# atau dibuang saat beban tinggi). Karena itu pemicu utama adalah cron eksternal yang memanggil
# workflow_dispatch lewat GitHub API tiap 15 menit (menit 7,22,37,52). Jadwal di bawah tetap
# dipakai sebagai cadangan. Riwayat run ada di tab Actions.
# Tiap run mengirim pesan: RINGKASAN bila ada pool, heartbeat bila tidak ada.
# State di pool_flow_state.json di-commit hanya bila berubah dan pengiriman berhasil.

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pool-flow-state
  cancel-in-progress: false

jobs:
  best:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run best pool check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -o pipefail
          python scripts/pool_flow_alert.py | tee /tmp/pool_flow.log

      - name: Commit state
        if: success()
        run: |
          if grep -q 'POOL_FLOW_CHANGED=1' /tmp/pool_flow.log; then
            git config user.name 'Pool-Flow-Bot'
            git config user.email 'bot@noreply.github.com'
            git add pool_flow_state.json
            git commit -m "pool-flow: update state [skip ci]"
            for attempt in 1 2 3; do
              if git pull --rebase -q origin main && git push -q origin HEAD:main; then
                echo "State terkirim (percobaan $attempt)."
                exit 0
              fi
              sleep 5
            done
            echo "Gagal push state setelah 3 percobaan."
            exit 1
          else
            echo "Tidak ada perubahan state."
          fi

name: Watchlist snapshot (8-hourly)

on:
  schedule:
    # every 8 hours (00/08/16 UTC = 07/15/23 WIB)
    - cron: "0 */8 * * *"
  workflow_dispatch: {}   # manual run button

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests pandas

      - name: Run daily snapshot
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          HELIUS_API_KEYS: ${{ secrets.HELIUS_API_KEYS }}
        run: python scripts/daily_snapshot.py

      - name: Commit history
        run: |
          git config user.name "snapshot-bot"
          git config user.email "actions@github.com"
          git add history.json watchlist.json
          git diff --cached --quiet || git commit -m "chore: daily snapshot $(date -u +%F)"
          git push

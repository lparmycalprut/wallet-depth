name: Early Watcher

# Early Watcher (permintaan user 2026-10-22): poll tiap 2 menit untuk 5 mint
# watchlist, alert Telegram + page. Cron GitHub minimal 5 menit dan sering
# terlambat, jadi satu job berjalan ~25 menit dan poll di dalamnya.
# Job dijadwalkan tiap 30 menit; grup concurrency membuat job berurutan, sehingga
# dua job tidak menulis state bersamaan. Jadwal hanya aktif dari default branch.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: early-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests curl_cffi

      - name: Watch early activity (≈25 menit, poll 2 menit)
        id: watch
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -o pipefail
          python scripts/early_watch.py --duration 1500 --interval 120 | tee /tmp/early.log
          echo "changed=$(grep -o 'EARLY_WATCH_CHANGED=[01]' /tmp/early.log \
            | tail -1 | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Commit state when decisions changed
        # Commit hanya bila fingerprint keputusan berubah (alert, status, cooldown,
        # last_active). Tanpa gate ini, setiap job membuat commit.
        if: steps.watch.outputs.changed == '1'
        run: |
          git config --global user.name 'Early-Bot'
          git config --global user.email 'bot@noreply.github.com'
          bash scripts/commit_early_state.sh

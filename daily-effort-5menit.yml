# Holder Dust Scanner — BERKAS SIAP PASANG (lane LP saja: Chart LP Meteora +
# Robinhood LP).
#
# ⚠️ INI BUKAN WORKFLOW AKTIF. GitHub hanya membaca folder `.github/workflows`,
# dan bot tidak bisa menulis ke sana (403 `refusing to allow a GitHub App to
# create or update workflow ... without 'workflows' permission`).
#
# Cara memasang: GitHub UI → Actions → "Holder Dust Scanner" → edit
# `.github/workflows/daily-effort.yml` → timpa SELURUH isinya dengan berkas ini
# (mulai baris `name:` di bawah) → commit. Setelah itu tidak ada lagi
# langkah bash rantai di YAML: seluruh logika ritme hidup di
# `scripts/chain_next_run.py` (bot BISA mengubahnya lewat commit + test
# `tests/test_chain_next_run.py`).
#
# Kenapa perlu dipasang (data run asli, 2026-09-09):
#   * `schedule: */5` GitHub hampir tidak pernah tepat waktu — hanya 4 run
#     schedule sehari (01:35, 06:41, 11:56, 16:30 UTC; jarak 4,5-5,2 jam);
#   * YAML terpasang masih punya Guard 2 lama: "run `event=schedule` terakhir
#     < 900 detik = schedule sehat → dispatch DILEWATI". Setelah setiap
#     schedule (telat) itu, dispatch berikutnya pasti dibuang → pipeline mati
#     sampai schedule berikutnya. Cron #1182 mati 16:40:24 UTC; tidak ada scan
#     sampai 17:29 UTC ke atas — snapshot basi + ⚡ EARLY DUMP Robinhood tidak
#     terkirim;
#   * Guard 2 baru membandingkan umur run terakhir (event APA PUN) dengan
#     jendela 240 detik (< kadens), jadi rantai selalu menyambung lagi;
#   * plus: query API kini retry + FAIL-OPEN. `bash -e` versi lama membuat
#     satu hiccup `curl | python3` membatalkan langkah rantai secara senyap
#     (stall yang sama, penyebab berbeda).
#
# Delta vs workflow TERPASANG (dicek `git diff` 2026-09-09): HANYA langkah
# "Chain run berikutnya" — Guard 2 lama (umur run `event=schedule` < 900 s =
# "schedule sehat" → dispatch dibuang) diganti `python scripts/chain_next_run.py`
# dengan guard baru. Input `full_scan` dan `timeout-minutes: 15` sudah
# terpasang; seluruh berkas tetap ditimpa supaya YAML dan root repo identik —
# begitu YAML memanggil skrip, kalibrasi ritme berikutnya tidak perlu lagi
# menyentuh folder workflow (yang tidak bisa ditulis bot).
#
# Alias `--scope all` (dispatch manual `watchlist.request_immediate_scan`)
# sengaja TIDAK dihapus dari `scripts/scan_holders.py` sampai berkas ini
# terpasang.

name: Holder Dust Scanner

on:
  schedule:
    # Target ±5 menit. GitHub schedule best-effort (terukur 2026-09-09: cuma
    # menyala 4x sehari, jarak antar-kejadian 4,5-5,2 JAM), jadi ritme
    # dipegang langkah "Chain run berikutnya" di bawah; schedule hanya jaring
    # pengaman kalau rantai putus.
    - cron: "*/5 * * * *"

  workflow_dispatch:
    inputs:
      telegram_test:
        description: "Kirim test alert Telegram sebelum scan"
        required: false
        default: false
        type: boolean
      full_scan:
        description: "Scan FULL lane LP (detail + baseline + kronologi wallet)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: holder-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install requests curl_cffi

      - name: Holder scan LP (Meteora + Robinhood, ±5 menit)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          # Blockscout PRO API (Robinhood Chain). Sejak 2026-09-08 instance
          # publik robinhoodchain.blockscout.com menolak request runner
          # (HTTP 403 bot-protection); key gratis: https://dev.blockscout.com
          # BLOCKSCOUT_API_KEYS = beberapa key dipisah koma (akun berbeda =
          # kuota berbeda; dipakai bergantian, key habis/ditolak diparkir).
          BLOCKSCOUT_API_KEY: ${{ secrets.BLOCKSCOUT_API_KEY }}
          BLOCKSCOUT_API_KEYS: ${{ secrets.BLOCKSCOUT_API_KEYS }}
          # Hemat Helius bila kuota menipis (tanpa ubah kode): scan Solana
          # hanya tiap N run — Robinhood tetap tiap 5 menit.
          # LP_SCAN_RUN_MULTIPLIER: "3"
        run: |
          ARGS=""
          if [ "${{ inputs.telegram_test }}" = "true" ]; then
            ARGS="$ARGS --telegram-test"
          fi
          if [ "${{ inputs.full_scan }}" = "true" ]; then
            ARGS="$ARGS --full --ignore-gap"
          fi
          # JANGAN pasang --max-wallets: urutan getTokenAccounts Helius
          # TIDAK urut saldo, jadi fetch terpotong (mis. 3000 dari 3994
          # akun) = sampel acak yang bias — dust (<=10 USD) bisa jauh lebih
          # kecil dari nilai aslinya, dan angka cron/Telegram tidak sinkron
          # dengan scan Helius di dashboard. Default kode sudah FULL
          # (FULL_SCAN_MAX_WALLETS=100.000, semua halaman sampai habis).
          # Kadar quota Helius: `LP_SCAN_RUN_MULTIPLIER: "3"` di env di
          # atas — itu pengganti cap wallet.
          python scripts/scan_holders.py $ARGS

      - name: Chain run berikutnya
        if: success() || failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Semua keputusan rantai ada di scripts/chain_next_run.py supaya
          # bisa diubah lewat commit biasa (bot ditolak menulis folder
          # .github/workflows). Kadens boleh dikalibrasi dari sini TANPA
          # menyentuh kode: ubah cron di atas + CHAIN_CADENCE_SEC di sini.
          CHAIN_CADENCE_SEC: "300"
          CHAIN_WORKFLOW: "daily-effort.yml"
          # CHAIN_QUIET_SEC: "240"   # wajib < CHAIN_CADENCE_SEC
          # CHAIN_LEAD_SEC: "20"
        run: python scripts/chain_next_run.py

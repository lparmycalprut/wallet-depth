# Holder Dust Scanner — versi **lane LP saja** (Chart LP Meteora + Robinhood LP).
#
# ⚠️ INI BUKAN WORKFLOW AKTIF. GitHub hanya membaca folder `.github/workflows`,
# dan bot tidak bisa menulis ke sana (terbukti 2026-09-07: `git push` ditolak
# `refusing to allow a GitHub App to create or update workflow
# .github/workflows/daily-effort.yml without 'workflows' permission`).
#
# Cara memasang: GitHub UI → Actions → "Holder Dust Scanner" → edit
# `.github/workflows/daily-effort.yml` → timpa seluruh isinya dengan berkas ini
# (mulai baris `name:` di bawah) → commit.
#
# Yang berubah dibanding workflow terpasang sekarang:
#   1. langkah "Chain run berikutnya" punya DUA rem supaya antrean concurrency
#      `holder-scanner` tidak menumpuk lalu saling membatalkan
#      ("Canceling since a higher priority waiting request …"): dispatch
#      dilewati bila masih ada run workflow ini yang queued/in_progress
#      (Guard 1), atau bila run lain baru selesai < CHAIN_QUIET_SEC=240 detik
#      (Guard 2). **Perbaikan 2026-09-09:** Guard 2 lama membandingkan umur
#      run *schedule* terakhir dengan 900 detik dan menyimpulkan "schedule
#      sehat" — padahal scheduler GitHub bisa di-throttle berjam-jam, jadi
#      sekali dispatch dilewati pipeline mati total (2026-09-09: kosong
#      12:05→15:15 UTC, ⚡ EARLY DUMP Robinhood tidak terkirim). Sekarang
#      pembandingnya run terakhir event apa pun dengan jendela < kadens
#      5 menit, sehingga rantai selalu menyambung lagi;
#   2. input `scan_all` (--scope all) diganti `full_scan` (--full) — scanner
#      hanya punya lane LP sejak 2026-09-07; `--scope` lama masih diterima
#      sebagai alias sementara supaya dispatch manual tidak crash sebelum
#      berkas ini terpasang;
#   3. `timeout-minutes` 45 → 15 (scan ±1-2 menit + tidur chain ±5 menit).
#
# Kode scanner (`scripts/scan_holders.py`) sudah selaras: selama berkas ini
# belum disalin, cron terpasang tetap jalan normal (tanpa argumen = lane LP
# tiap run) — hanya rem anti-tabrakan dan input `full_scan` yang belum aktif.

name: Holder Dust Scanner

on:
  schedule:
    # Target ±5 menit. GitHub schedule best-effort (bisa telat sampai jam),
    # jadi ritme dijaga langkah "Chain run berikutnya" di bawah.
    - cron: "*/5 * * * *"

  workflow_dispatch:
    inputs:
      telegram_test:
        description: "Kirim test alert Telegram sebelum scan"
        required: false
        default: false
        type: boolean
      full_scan:
        description: "Scan FULL lane LP (detail + baseline + kronologi wallet)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: holder-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install requests curl_cffi

      - name: Holder scan LP (Meteora + Robinhood, ±5 menit)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          # Blockscout PRO API (Robinhood Chain). Sejak 2026-09-08 instance
          # publik robinhoodchain.blockscout.com menolak request runner
          # (HTTP 403 bot-protection); key gratis: https://dev.blockscout.com
          # BLOCKSCOUT_API_KEYS = beberapa key dipisah koma (akun berbeda =
          # kuota berbeda; dipakai bergantian, key habis/ditolak diparkir).
          BLOCKSCOUT_API_KEY: ${{ secrets.BLOCKSCOUT_API_KEY }}
          BLOCKSCOUT_API_KEYS: ${{ secrets.BLOCKSCOUT_API_KEYS }}
          # Hemat Helius bila kuota menipis (tanpa ubah kode): scan Solana
          # hanya tiap N run — Robinhood tetap tiap 5 menit.
          # LP_SCAN_RUN_MULTIPLIER: "3"
        run: |
          ARGS=""
          if [ "${{ inputs.telegram_test }}" = "true" ]; then
            ARGS="$ARGS --telegram-test"
          fi
          if [ "${{ inputs.full_scan }}" = "true" ]; then
            ARGS="$ARGS --full --ignore-gap"
          fi
          # JANGAN pasang --max-wallets: urutan getTokenAccounts Helius
          # TIDAK urut saldo, jadi fetch terpotong (mis. 3000 dari 3994
          # akun) = sampel acak yang bias — dust (≤$10) bisa jauh lebih
          # kecil dari nilai aslinya, dan angka cron/Telegram tidak sinkron
          # dengan scan Helius di dashboard. Default kode sudah FULL
          # (FULL_SCAN_MAX_WALLETS=100.000, semua halaman sampai habis).
          # Kadar quota Helius: `LP_SCAN_RUN_MULTIPLIER: "3"` di env di
          # atas — itu pengganti cap wallet.
          python scripts/scan_holders.py $ARGS

      - name: Chain run berikutnya
        if: success() || failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          API="https://api.github.com/repos/${{ github.repository }}/actions/workflows/daily-effort.yml/runs"
          # Jendela "run lain baru saja selesai" untuk Guard 2. HARUS lebih
          # pendek dari kadens 5 menit (300 detik) — kalau tidak, rantai
          # dispatch mematikan dirinya sendiri dan pipeline berhenti total.
          CHAIN_QUIET_SEC=240
          NOW=$(date +%s)
          WAIT=$((300 - NOW % 300 + 20))
          echo "Tidur ${WAIT}s sampai batas 5 menit berikutnya."
          sleep "$WAIT"

          # Guard 1 — jangan menumpuk antrean concurrency `holder-scanner`.
          # GitHub hanya menahan SATU run mengantre per group; request ketiga
          # membatalkan yang sedang mengantre ("Canceling since a higher
          # priority waiting request for holder-scanner exists").
          ACTIVE=$(curl -sSf -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" "$API?per_page=25" \
            | python3 -c "import json,sys; runs=json.load(sys.stdin).get('workflow_runs') or []; me='${{ github.run_id }}'; print(sum(1 for r in runs if str(r.get('id')) != me and r.get('status') in ('queued','in_progress','waiting')))")
          if [ "${ACTIVE:-0}" -gt 0 ]; then
            echo "Sudah ada ${ACTIVE} run aktif/mengantre — dispatch dilewati (anti tabrakan holder-scanner)."
            exit 0
          fi

          # Guard 2 — rem anti run kembar, BUKAN penilai kesehatan schedule.
          #
          # Perbaikan 2026-09-09: pembandingnya **run terakhir event apa pun**
          # dengan jendela CHAIN_QUIET_SEC (240 detik — lebih pendek dari
          # kadens 5 menit), bukan "run schedule terakhir < 15 menit".
          # Versi lama menyimpulkan "schedule */5 sehat" hanya karena ada run
          # schedule yang baru selesai, lalu MELEWATI dispatch — padahal
          # scheduler GitHub bisa di-throttle berjam-jam, dan begitu satu
          # dispatch dilewati tidak ada lagi yang membangunkan pipeline.
          # Kasus nyata 2026-09-09: run terakhir selesai 12:05 UTC lalu kosong
          # sampai 15:15 UTC (±3 jam) — snapshot holder basi dan ⚡ EARLY DUMP
          # Robinhood tidak terkirim meski token sudah di atas 0,1% MC.
          # Aman dari stall: langkah ini selalu tidur sampai batas 5 menit
          # berikutnya sebelum memeriksa, jadi satu run minimal berlangsung
          # ±320 detik — run yang baru selesai pasti lebih tua dari jendela
          # 240 detik dan rantai selalu tersambung lagi.
          LAST_RUN=$(curl -sSf -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" "$API?per_page=25" \
            | python3 -c "import json,sys,datetime; runs=json.load(sys.stdin).get('workflow_runs') or []; me='${{ github.run_id }}'; ts=[int(datetime.datetime.strptime(r['updated_at'],'%Y-%m-%dT%H:%M:%SZ').replace(tzinfo=datetime.timezone.utc).timestamp()) for r in runs if str(r.get('id')) != me and r.get('status') == 'completed' and r.get('updated_at')]; print(max(ts) if ts else 0)")
          AGE=$(( $(date +%s) - ${LAST_RUN:-0} ))
          if [ "${LAST_RUN:-0}" -gt 0 ] && [ "$AGE" -lt "$CHAIN_QUIET_SEC" ]; then
            echo "Run lain selesai ${AGE}s lalu (< ${CHAIN_QUIET_SEC}s) — dispatch dilewati, run itu yang merantai."
            exit 0
          fi

          curl -sSf -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/daily-effort.yml/dispatches \
            -d '{"ref":"${{ github.ref_name }}"}'
          echo "Run berikutnya di-dispatch (run terakhir selesai ${AGE}s lalu)."
